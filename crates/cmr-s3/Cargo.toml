[package]
name = "cmr-s3"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
description = "Encrypted S3 server backed by Cloud Mail.ru"

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
aes-kw = "0.3.1"
async-stream = "0.3.6"
async-trait = "0.1.92"
base64 = "0.22.1"
bytes = "1.12"
clap = { version = "4.6", features = ["derive", "env"] }
cmr-api = { path = "../cmr-api" }
crc-fast = "1.10"
futures-core = "0.3.34"
futures-util = "0.3.34"
getrandom = "0.4"
hex = "0.4.3"
hkdf = "0.13"
hmac = "0.13"
http = "1.4"
hyper = { version = "1.12", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
s3s = "0.17.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["fs", "io-util", "net", "rt-multi-thread", "macros", "signal", "sync", "time"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26", features = ["v4"] }
zeroize = "1.8"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "query"] }
tokio = { version = "1.53.1", features = ["process"] }

[lints]
workspace = true
