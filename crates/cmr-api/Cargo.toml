[package]
name = "cmr-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Asynchronous Cloud Mail.ru drive client"

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
bytes = "1.12"
futures-core = "0.3.34"
futures-util = "0.3.34"
httpdate = "1.0.3"
rand = "0.9.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip", "stream", "form", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
sha1 = "0.10.7"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }
url = "2.5.7"

[dev-dependencies]
flate2 = "1.1"
http = "1.4"
proptest = { version = "1.11", default-features = false, features = ["std"] }
httpmock = { version = "0.8.3", default-features = false, features = ["https"] }
rustls = { version = "0.23.44", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["macros", "test-util"] }

[lints]
workspace = true
